<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Private Space</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 🔒 Login Box -->
    <div id="login-box" class="login-container">
        <h2>💖 Security Lock</h2>
        <p>Sirf authorized log hi enter kar sakte hain.</p>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button id="login-btn">Unlock Space</button>
        <p id="login-error" style="color: red; display: none; margin-top: 10px;">Galt Details! Phir se try karein.</p>
    </div>

    <!-- 💬 Main Chat Box -->
    <div id="chat-box" class="chat-container" style="display: none;">
        <div class="chat-header">
            <h2 id="user-display">💖 Private Chat</h2>
            <div class="header-buttons">
                <button id="call-btn">📞 Call</button>
                <button id="logout-btn" class="logout-button">🚪 Logout</button>
            </div>
        </div>
        
        <div id="chat-messages" class="chat-messages"></div>
        
        <div class="video-container" id="video-container" style="display: none;">
            <video id="localVideo" autoplay playsinline muted></video>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>

        <div class="chat-input-area">
            <label for="image-input" class="image-label">📷</label>
            <input type="file" id="image-input" accept="image/*" style="display: none;">
            <input type="text" id="message-input" placeholder="Type a message...">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <!-- 🎵 Notification Sound File Load -->
    <audio id="notif-sound" src="https://mixkit.co" preload="auto"></audio>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
