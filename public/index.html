<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Our Ultimate Private Space</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 🔒 Security Login Box -->
    <div id="login-box" class="login-container">
        <h2>💖 Private Space Lock</h2>
        <p>Enter credentials to access private chat room.</p>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button id="login-btn">Unlock Space</button>
        <p id="login-error" style="color: red; display: none; margin-top: 10px;">Invalid Details!</p>
    </div>

    <!-- 📞 Fullscreen Call Window Overlays (WhatsApp Style) -->
    <div id="call-overlay" class="call-overlay" style="display: none;">
        <div class="call-background"></div>
        <div class="call-content-ui">
            <div class="caller-avatar-zone">
                <div class="pulse-avatar">💖</div>
                <h2 id="fullscreen-caller-title">Partner Name</h2>
                <p id="call-status-label">Ringing...</p>
            </div>
            
            <!-- Fullscreen Video Display Grid -->
            <div id="fullscreen-video-grid" class="fullscreen-video-grid" style="display: none;">
                <video id="remoteVideo" autoplay playsinline></video>
                <video id="localVideo" autoplay playsinline muted class="pip-local-video"></video>
            </div>

            <!-- Call Tray Controls -->
            <div class="call-controls-tray">
                <button id="toggle-mic-btn" class="control-circle">🎙️</button>
                <button id="end-call-btn" class="control-circle reject-red-btn">🤙</button>
                <button id="toggle-cam-btn" class="control-circle" style="display: none;">📹</button>
            </div>
        </div>
    </div>

    <!-- 💬 Main Dynamic Chat Window Frame -->
    <div id="chat-box" class="chat-container" style="display: none;">
        <div class="chat-header">
            <div class="user-meta-info">
                <h2 id="user-display">💖 Private Space</h2>
                <span id="partner-status" class="status-indicator offline">offline</span>
            </div>
            <div class="header-buttons">
                <button id="voice-call-btn" class="header-icon-btn">📞</button>
                <button id="video-call-btn" class="header-icon-btn">📹</button>
                <button id="clear-chat-btn" class="header-icon-btn danger-text" title="Clear History">🗑️</button>
                <button id="logout-btn" class="logout-button">Logout</button>
            </div>
        </div>
        
        <div id="chat-messages" class="chat-messages"></div>
        
        <!-- Live Instant Camera Capture Tray -->
        <div id="camera-capture-zone" style="display: none; padding: 10px; background: #222; text-align: center;">
            <video id="capture-webcam" autoplay playsinline style="width: 100%; max-height: 250px; border-radius: 12px; object-fit: cover;"></video>
            <div style="margin-top: 8px; display: flex; justify-content: center; gap: 15px;">
                <button id="snap-photo-btn" style="background: #2ecc71; border: none; color: white; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer;">📸 Capture</button>
                <button id="close-capture-btn" style="background: #e74c3c; border: none; color: white; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer;">Cancel</button>
            </div>
            <canvas id="capture-canvas" style="display: none;"></canvas>
        </div>
        
        <div class="chat-input-area">
            <!-- Gallery Button -->
            <label for="image-input" class="image-label" title="Choose from Gallery">📁</label>
            <input type="file" id="image-input" accept="image/*" style="display: none;">
            
            <!-- Live Camera Button -->
            <span id="live-camera-btn" class="image-label" style="cursor: pointer;" title="Click Present Photo">📸</span>
            
            <input type="text" id="message-input" placeholder="Type safe message...">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <audio id="notif-sound" src="https://mixkit.co" preload="auto"></audio>
    <audio id="ringtone-sound" src="https://mixkit.co" loop preload="auto"></audio>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
